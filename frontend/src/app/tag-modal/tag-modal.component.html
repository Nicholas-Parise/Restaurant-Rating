<div class="modal-overlay" (click)="closeForm()">
    <div class="modal" (click)="$event.stopPropagation()">
        <h2>Select Tags</h2>
        <input type="text" [(ngModel)]="tagSearch" placeholder="Search tags..." class="search-input" />

        <div class="tag-container">
            @if (filteredSelectedTags.length > 0) {
            <div class="section-title">Selected</div>
            @for (tag of filteredSelectedTags; track tag.id) {
            <button type="button" class="tag-button selected" (click)="toggleTag(tag)">
                {{ tag.name }}
            </button>
            }
            }

            @if (filteredAvailableTags.length > 0) {
            <div class="section-title">Available</div>
            @for (tag of filteredAvailableTags; track tag.id) {
            <button type="button" class="tag-button" (click)="toggleTag(tag)">
                {{ tag.name }}
            </button>
            }
            }
        </div>

        <div class="modal-actions">
            <button type="button" class="btn btn-success" (click)="onSubmit()">
                Apply
            </button>
            <button type="button" class="btn btn-cancel" (click)="closeForm()">
                Cancel
            </button>
        </div>
    </div>
</div>
